# Teaching — the Teaching page. Edit freely; order on the page = order here.
intro: >-
  We teach how to quantitatively understand biological systems using predictive models. We teach in TU Delft's Life Sciences and Technology
  MSc program, and often organize or participate in international workshops and summer schools.

# University courses (big cards)
courses:
  - title: Analysis of Metabolic Networks
    short: AMN
    where: MSc Life Science & Technology, TU Delft
    detail: Cell Factory specialisation; elective in Biochemical Engineering
    summary: >-
      Mass balances and analysis of bioreactor data; constraint-based, stoichiometric, and thermodynamic analysis of metabolic pathways and networks.
    url: 'https://studiegids.tudelft.nl/courses/study-guide/educations/31267'

# Postgraduate courses for industry and academia at BioTech Delft (smaller navy cards). when: next edition.
postgrad:
  - title: Microbial Physiology and Fermentation Technology
    short: MPFT
    where: BioTech Delft · Advanced course
    role: Lecturer
    when: 'Next edition: 11–21 January 2027'
    summary: Two-week course linking metabolic stoichiometry, kinetics and systems physiology to strain design and large-scale fermentation.
    url: 'https://biotechdelft.com/courses/microbial-physiology-and-fermentation-technology/'
  - title: Multi-Omics approaches for Improvement of Industrial Microbes
    short: Multi-Omics
    where: BioTech Delft · Advanced course
    role: Lecturer and course board member
    when: 'Next edition: 29 May – 2 June 2028'
    summary: Five-day course on integrating metabolomics, fluxomics, transcriptomics and proteomics with modeling to find targets for improving industrial microbes.
    url: 'https://biotechdelft.com/courses/integrated-multi-omics-approaches-for-improvement-of-industrial-microbes/'

# Workshops, schools and courses outside TU Delft (newest first). role: what we did.
workshops:
