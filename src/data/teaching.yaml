    role: Co-chair (with Ivica Dimkić, University of Belgrade); lecture and hands-on practicals
    summary: Five-day practical workshop for PhD students and postdocs, supported by FEMS — metagenomics, genome-scale metabolic modeling and structure–function landscapes of microbial consortia.
    url: 'https://bgmicrobiomes.github.io/'
