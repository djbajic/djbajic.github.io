- title: High-order interactions distort the functional landscape of microbial consortia
  authors: A. Sánchez-Gorostiaga*, D. Bajić*, M.L. Osborne, J.F. Poyatos, A. Sánchez
  journal: PLoS Biology
  year: 2019
  doi: 10.1371/journal.pbio.3000550
  image: starch_epsilon.webp
  summary: We extended the theory of fitness landscapes to characterize an ecological structure-function landscape, the map between the composition and function of microbial consortia. This allowed us to separate the effect of behavioral and population dynamics interactions, and show that higher-order interactions critically affect our ability to predict and engineer complex ecosystem function.
  highlight: false
  theme: function
  preprint: false
- title: On the deformability of an empirical fitness landscape by microbial evolution
  authors: 'D. Bajić*#, J.C.C. Vila*, Z. Blount, A. Sánchez#'
  journal: Proceedings of the National Academy of Sciences
  year: 2018
  doi: 10.1073/pnas.1808485115
  image: deformability.webp
  summary: In this work, we formally defined a new kind of ecologically mediated genetic interaction, that we called “non-commutative epistasis”. We used it to quantitatively chart eco-evolutionary interactions on an empirical genotype-phenotype map, showing how they can deform fitness landscapes profoundly altering long-term evolution.
  highlight: false
  theme: architecture
  preprint: false
- title: Emergent simplicity in microbial community assembly
  authors: 'J.E. Goldford*, N. Lu*, D. Bajić, S. Estrela, M. Tikhonov, A. Sánchez-Gorostiaga, D. Segrè, P. Mehta#, A. Sánchez#'
  journal: Science
  year: 2018
  doi: 10.1126/science.aat1168
  image: crossfeeding.webp
  summary: We demonstrated in a novel experimental system that function and coarse-grained taxonomy of microbial communities are predictable and governed by resource availability, despite species-level variability. We also showed that these features are emergent properties of the assembly of large microbial communities due to the presence of cross-feeding.
