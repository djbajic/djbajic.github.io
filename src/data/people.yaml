# People — edit here. photo: file in public/img/team/ (optional). status: current | alumni
- name: Djordje Bajić
  role: Principal Investigator
  title: Assistant Professor, TU Delft
  photo: djordje_cropped.webp
  status: current
  bio: >-
    Djordje is interested in how structure gives rise to function in biological systems — how genes in a
    genome combine into a trait, and how species in a community combine into a function. Before Delft he was a
    postdoc with Álvaro Sánchez at Yale (Ecology & Evolutionary Biology), and did his PhD in biophysics with
    Juan Poyatos at the Centro Nacional de Biotecnología (CSIC), Madrid.
  links:
    scholar: https://scholar.google.com/citations?user=6tfrMqYAAAAJ
    orcid: https://orcid.org/0000-0002-6716-7898
    github: https://github.com/djbajic
    cv: /CV_Djordje_Bajic.pdf
- name: Minke Gabriëls
  role: PhD candidate
  photo: minke.webp
  status: current
  bio: >-
    Engineering the function of microbial communities with genome-scale metabolic models and fitness-landscape
    analysis, with a focus on electrosynthetic biofilm communities (CO₂ + electricity → product).
- name: Uroš Gojković
  role: PhD candidate
  photo: uros.webp
  status: current
  bio: >-
    Rationally steering community composition through metabolic interventions, using model communities
    assembled both in high throughput and in bioreactors.
